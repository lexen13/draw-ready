<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Draw Ready</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Draw Ready">
<meta name="theme-color" content="#F2F5F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app, sticky title bar, fixed bottom tabs; specimen-label motif for results. */
:root{
  --bg:#F2F5F6; --surface:#FFFFFF; --sunk:#E7EDEF; --ink:#15212A; --muted:#566771; --line:#D3DCE0; --line-strong:#9FB0B8;
  --accent:#8C1C2E; --accent-soft:#F6E4E7; --on-accent:#FFFFFF;
  --ok:#1D7550; --ok-soft:#DFF1E8; --bad:#B42318; --bad-soft:#FBE6E3; --warn:#9A5B00;
  --blood:#9E2235; --glass:#F7FAFB;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1417; --surface:#162027; --sunk:#1D2A31; --ink:#E5ECEF; --muted:#94A6B0; --line:#26353D; --line-strong:#4A5D67;
  --accent:#E8667A; --accent-soft:#3A1F26; --on-accent:#1A0B0F;
  --ok:#4CC48F; --ok-soft:#173327; --bad:#F2796D; --bad-soft:#3A1E1B; --warn:#E3A44A;
  --blood:#C5384E; --glass:#1B262D; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1417; --surface:#162027; --sunk:#1D2A31; --ink:#E5ECEF; --muted:#94A6B0; --line:#26353D; --line-strong:#4A5D67;
  --accent:#E8667A; --accent-soft:#3A1F26; --on-accent:#1A0B0F;
  --ok:#4CC48F; --ok-soft:#173327; --bad:#F2796D; --bad-soft:#3A1E1B; --warn:#E3A44A;
  --blood:#C5384E; --glass:#1B262D; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;flex:1;min-width:0;text-wrap:balance}
.back{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.brand{display:flex;align-items:center;gap:8px}
.brand .drop{width:14px;height:18px;background:var(--blood);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transform:rotate(0deg);clip-path:polygon(50% 0,100% 62%,90% 85%,70% 98%,50% 100%,30% 98%,10% 85%,0 62%)}

.stack{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Hero class card */
.hero{background:var(--accent);color:var(--on-accent);border:none;position:relative;overflow:hidden}
.hero .eyebrow{color:inherit;opacity:.8}
.hero .count{padding-right:78px;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,40px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 4px}
.hero .where{font-size:14.5px;opacity:.9}
.hero .weekpill{display:inline-block;margin-top:12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:color-mix(in srgb,var(--on-accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--on-accent) 35%,transparent)}
.hero .rack{position:absolute;right:14px;top:16px;display:flex;gap:5px;opacity:.95}
.setdate{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.setdate input{background:color-mix(in srgb,var(--on-accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--on-accent) 40%,transparent);border-radius:10px;padding:8px 10px;color:inherit;color-scheme:dark}

/* Week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cell{border-radius:10px;padding:8px 0 6px;text-align:center;background:var(--sunk);border:1px solid var(--line);font-family:var(--f-mono);font-size:11px;line-height:1.3}
.cell b{display:block;font-size:13px;font-family:var(--f-body)}
.cell.pass{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.cell.fail{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.cell.now{outline:2px solid var(--accent);outline-offset:1px}

.stat{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats .card{padding:12px}
.action{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.action .grow h3{font-size:16px}
.chev{color:var(--muted);flex:none}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.04em;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* Week list */
.weekrow{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.wnum{font-family:var(--f-display);font-weight:800;font-size:26px;width:34px;text-align:center;color:var(--accent);flex:none}
.weekrow.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Notes */
.notes{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none;counter-reset:n}
.notes li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px 46px;position:relative;counter-increment:n}
.notes li::before{content:counter(n);position:absolute;left:14px;top:14px;font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700}
.notes strong{color:var(--accent)}

/* Flashcard */
.flash{perspective:1200px;min-height:260px}
.flash-in{position:relative;min-height:260px;transition:transform .45s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.face.back{transform:rotateY(180deg);background:var(--glass);border-color:var(--line-strong)}
.face .big{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,5.6vw,25px);line-height:1.25;text-wrap:balance}
.face .hint{position:absolute;bottom:14px;left:22px;right:22px;font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade .btn{flex-direction:column;gap:0;padding:8px}
.grade .btn small{font-weight:400;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
@media (prefers-reduced-motion: reduce){.flash-in{transition:none}}

/* Quiz */
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qtext{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,5vw,22px);line-height:1.3;text-wrap:pretty}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;min-height:52px}
.choice .k{font-family:var(--f-mono);font-weight:700;font-size:13px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--sunk);flex:none;margin-top:1px}
.choice.sel{border-color:var(--accent);background:var(--accent-soft)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .k{background:var(--ok);color:var(--surface)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .k{background:var(--bad);color:var(--surface)}
.choice:disabled{cursor:default;opacity:1}
.explain{border-left:4px solid var(--ok);background:var(--surface);border-radius:0 12px 12px 0;padding:12px 14px;font-size:15px}
.explain.no{border-left-color:var(--bad)}
.explain b{display:block;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.explain.yes b{color:var(--ok)} .explain.no b{color:var(--bad)}
.timer{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}

/* Specimen label */
.label{font-family:var(--f-mono);background:var(--glass);border:1.5px dashed var(--line-strong);border-radius:6px;padding:12px 14px;font-size:12.5px;line-height:1.6;position:relative}
.label .lrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.label .score{font-size:30px;font-weight:700;line-height:1.1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.label .bc{height:26px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px);opacity:.75;border-radius:2px}
.stamp{position:absolute;right:12px;top:10px;font-weight:700;letter-spacing:.12em;padding:2px 8px;border:2px solid currentColor;border-radius:4px;transform:rotate(-6deg);font-size:13px}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad)}
.dombar{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:14px}
.dombar .bar i{background:var(--ok)}
.dombar .bar.low i{background:var(--bad)}

/* Tubes */
.tube{display:inline-block;width:20px;height:50px;border:1.5px solid var(--line-strong);border-top:none;border-radius:0 0 10px 10px;position:relative;margin-top:12px;background:linear-gradient(to bottom,var(--glass) 38%,var(--blood) 38%);flex:none}
.tube i{position:absolute;left:-4px;right:-4px;top:-12px;height:13px;border-radius:4px 4px 2px 2px;border:1px solid rgba(0,0,0,.18)}
.hero .tube{border-color:color-mix(in srgb,var(--on-accent) 60%,transparent);background:linear-gradient(to bottom,transparent 38%,color-mix(in srgb,var(--on-accent) 30%,transparent) 38%)}
.tubebtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tubebtn{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 6px 12px;font-size:13.5px;font-weight:700;text-align:center;line-height:1.2;min-height:118px}
.tubebtn.done{opacity:.28}
.tubebtn.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.tubebtn.shake{animation:none;border-color:var(--bad)}}
.rackrow{display:flex;gap:10px;align-items:flex-end;min-height:76px;padding:6px 12px 10px;background:var(--sunk);border-radius:12px;border-bottom:6px solid var(--line-strong);overflow-x:auto}
.rackrow .slot{display:flex;flex-direction:column;align-items:center;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.tubetable{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.trow .tube{margin-top:10px;height:40px;width:16px}
.trow .tube i{top:-10px;height:11px}
.trow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:16px;flex:none}

/* Listen */
.listen-card{min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:left}
.listen-card .big{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,5.6vw,24px);line-height:1.3;text-wrap:balance}
.speaking{display:inline-flex;gap:3px;align-items:flex-end;height:16px}
.speaking span{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s infinite ease-in-out}
.speaking span:nth-child(2){animation-delay:.15s}.speaking span:nth-child(3){animation-delay:.3s}.speaking span:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.paused .speaking span{animation:none;height:4px}
select{background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:9px 10px;min-height:44px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}

.confirm{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.missitem{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.missitem:first-child{border-top:none;padding-top:0}
.ans{color:var(--ok);font-weight:700}
.yours{color:var(--bad)}

/* additions for v2 */
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;padding:3px 8px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-weight:700}
.badge.pre{background:var(--sunk);color:var(--muted);font-weight:500}
.sec-h{font-family:var(--f-display);font-weight:600;font-size:17px;margin:6px 0 -2px 2px}
.memo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.memo .action{flex-direction:column;align-items:flex-start;gap:8px;padding:14px}
.memo .action .rowtubes{display:flex;gap:3px}
.memo .action .rowtubes .tube{width:12px;height:30px;margin-top:8px}
.memo .action .rowtubes .tube i{top:-7px;height:8px;left:-2px;right:-2px}
.tubebtn{min-height:112px;font-size:13px}
.tubebtn .num{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.steplist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.steplist li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.steplist .sn{font-family:var(--f-mono);font-weight:700;font-size:12px;min-width:26px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.steplist .say{display:block;color:var(--muted);font-size:14px;margin-top:2px;font-style:italic}
.placed{display:flex;flex-direction:column;gap:4px}
.placed div{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ok)}
.placed b{font-family:var(--f-mono);font-size:12px;min-width:22px}
.procbtns{display:flex;flex-direction:column;gap:8px}
.procbtn{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;min-height:50px}
.procbtn.shake{animation:shake .35s;border-color:var(--bad)}
.phasegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phasegrid .btn{justify-content:flex-start;text-align:left;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px}
.phasegrid .btn small{font-weight:400;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.phasegrid .btn.ok{border-color:var(--ok)}
.phasegrid .btn.ok small{color:var(--ok)}
.sched{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sched .srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.sched .srow.off{color:var(--muted);text-decoration:line-through}
.sched .srow.done{color:var(--muted)}
.sched .srow button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700;min-height:34px;text-decoration:none}
.ttable{display:flex;flex-direction:column;gap:6px}
.trow .meta{font-size:13.5px;color:var(--muted)}

const DAYS=[
{n:1,title:"Fundamentals, Routine Collections & Venipuncture",tag:"Venipuncture",src:"Day 1 slides · textbook pp. 5–11 & 14–20",confirmed:true,notes:[
 {h:"The phlebotomist",items:[
  "A phlebotomist uses needles to puncture veins and collect blood for lab testing. Providers use the results to <strong>detect problems, monitor patients, and see if treatment is working</strong>.",
  "The job is more than drawing blood: <strong>processing specimens</strong> and <strong>collecting non-blood specimens</strong> (urine, stool, sputum, semen).",
  "Desired traits: <strong>Respect, Service, Growth</strong>. Ethics: reliability, accuracy and precision in collection, and <strong>do no harm</strong>.",
  ]},
 {h:"Equipment (ETS = evacuated tube system)",items:[
  "New, well-fitted <strong>gloves</strong> for every patient. Clean with <strong>70% isopropyl alcohol</strong> and let it dry. Alcohol allergy → <strong>chlorhexidine</strong>.",
  "<strong>Tourniquet</strong>: 3–4 inches above the site, on <strong>no more than 1 minute</strong>. Too tight can collapse the vein. No tourniquet? A <strong>BP cuff at 40 mmHg</strong>. You may tie it over the sleeve (older patients).",
  "<strong>Needle</strong>: most often <strong>21 gauge</strong>, 1–1.5 inches, double-ended, <strong>bevel up</strong>. <strong>Larger number = smaller needle.</strong> Caps: <strong>21g green</strong>, <strong>22g black</strong> (smaller veins), <strong>18g</strong> for blood donation.",
  "Before uncapping, inspect: <strong>expiration date</strong> (sterility), <strong>seal/label intact</strong>, <strong>safety device</strong>, <strong>bevel</strong> (burrs).",
  "<strong>Hub/adapter</strong> guides the tube onto the needle. It’s <strong>single use</strong> (OSHA): the whole assembly goes in sharps.",
  "<strong>Butterfly</strong> for small, rolling veins and hand draws. Wings: <strong>25g orange, 23g blue, 21g green</strong>. <strong>Syringe</strong> for fragile, collapsing veins; fill tubes with a transfer device.",
  "Sharps container: puncture resistant, red, biohazard label. Never reach in. Your textbook says fill to <strong>2/3</strong>.",
  "The “significant seven,” <strong>TANTACT</strong>: Tourniquet, Adapter, Needle, Tubes, Alcohol, Cotton, Tape."]},
 {h:"Tubes & order of draw (slide 14, memorize)",items:[
  "<strong>1 · Blood culture bottles / light yellow SPS</strong> → blood cultures (ordered for high fever; 2 drawn together).",
  "<strong>2 · Light blue</strong>, sodium citrate → PT, INR, PTT, clotting time. <strong>Fill completely, 9:1.</strong>",
  "<strong>3 · Serum tubes: red, gold, tiger, orange</strong>. Clot activator in all (slides say <strong>thrombin</strong>); gel in gold, tiger and orange (<strong>red has no gel</strong>). BUN, lipids, CMP, PSA, thyroid (TSH, T3, T4), bilirubin, FSH, LH. <strong>Testosterone = red only.</strong> Clot <strong>30 min</strong> before spinning; orange RST (STAT) clots in <strong>5 min</strong>.",
  "<strong>4 · Green</strong>, lithium or sodium heparin → ammonia, electrolytes, sodium, chromosome analysis.",
  "<strong>5 · Lavender</strong>, EDTA → CBC, A1C, WBC, ESR (whole blood). Fill at least 2/3.",
  "<strong>6 · Pink</strong>, EDTA → blood bank.",
  "<strong>7 · Gray</strong>, sodium fluoride (preservative, protects glucose) + potassium oxalate (anticoagulant) → glucose, alcohol, lactic acid.",
  "<strong>8 · Light yellow ACD</strong> → genetics, ABO. <strong>9 · Royal blue</strong> → trace elements (mercury, copper, zinc, cobalt); lavender strip = EDTA, red strip = clot activator.",
  "Order of draw prevents <strong>additive carryover</strong>. Same order with a syringe. An <strong>anticoagulant</strong> prevents clotting. Invert tubes <strong>8–10 times on average</strong> (slide 12)."]},
 {h:"Vein selection",items:[
  "Tourniquet tie: pull ends to create tension → cross one flap over the other → tuck a loop.",
  "Primary site: <strong>antecubital fossa</strong>. Order: <strong>median cubital → cephalic → basilic</strong>. Basilic is last: near the <strong>brachial artery and nerves</strong>. Cephalic is lateral (thumb side), slightly more painful.",
  "Secondary: <strong>dorsal hand</strong> (use a butterfly). Tertiary: ankle/foot, <strong>doctor’s authorization required</strong>. Avoid legs/feet in <strong>diabetics</strong> (textbook adds heart patients).",
  "Palpate: a good vein is <strong>soft, flexible, bouncy</strong>. Feel for depth, direction, dimension. Choose by touch, not sight.",
  "Avoid: fresh tattoos, hematoma, scars, edema, sclerosed veins, <strong>mastectomy side</strong>, <strong>same arm as IV</strong>. IV rules: <strong>opposite arm → draw below IV → RN turns IV off 2 min</strong>.",
  "Vein types to avoid: <strong>phlebitic</strong> (tender, warm, red), <strong>tortuous</strong> (twisted), <strong>thrombotic</strong> (clotted, hard), <strong>sclerotic</strong> (hard, narrow), <strong>fragile</strong>.",
  "No veins? Have the patient <strong>dangle the arm 1–2 min</strong>. Textbook: rotate the hand palm down, trace the vein, use gravity. No fist pumping or tapping.",
  "Artery hit: <strong>stop and hold pressure at least 5 min</strong>. Only <strong>2 attempts</strong> per phlebotomist."]},
 {h:"Complications",items:[
  "<strong>Hematoma</strong> = most common. Needle went through both walls (<strong>transfix</strong>) and blood leaks into tissue.",
  "<strong>Nerve</strong>: pain or numbness right after insertion → <strong>stop immediately</strong>. <strong>Phlebitis</strong>: inflamed vessel from repeated use. <strong>Thrombosis</strong>: clot blocking the vein.",
  "<strong>Hemoconcentration</strong>: tourniquet too long or fist pumping; alters potassium, ammonia. <strong>Petechiae</strong>: small red dots below a tight/long tourniquet.",
  "<strong>Shock</strong>: cold, clammy, pale skin, rapid pulse, shallow breathing → call for help, open airway, control bleeding, keep warm.",
  "<strong>Nausea</strong>: don’t start, or stop. <strong>Diaphoresis</strong> = excessive sweating. <strong>Seizure</strong>: stop, protect from injury, supine if possible.",
  "<strong>Syncope</strong> (fainting): remove tourniquet and needle, <strong>head between the legs</strong>. History of fainting → <strong>supine before the draw</strong>; observe 15 min after an episode."]},
 {h:"Before the draw",items:[
  "Six prep steps: <strong>identify → review requisition → consent → interview & educate → position → select site</strong>.",
  "<strong>Patient ID is the most important step.</strong> Give your name and department (say if you’re a student). Joint Commission: <strong>2 identifiers</strong>. Never ask “Are you ___?”",
  "Inpatient: state and <strong>spell</strong> name + DOB, compare to requisition, check wristband. Sleeping? Wake them. <strong>No band = no draw</strong> until the nurse attaches one. Outpatient: name + DOB, driver’s license if needed.",
  "<strong>C.O.R.E.</strong>: Compare identifiers · Obtain sample · Reach for labels and affix at the patient’s side · Exit only when C, O, R are done. Interrupted → <strong>start over at C</strong>.",
  "Requisition must have <strong>5 things</strong>: full name, DOB, gender, MRN, doctor’s info. Priority: emergency, ASAP, STAT, routine, timed. Missing info → <strong>contact the provider</strong>. The <strong>accession number</strong> identifies the specimen in the lab.",
  "Consent: <strong>informed</strong> (fully explained), <strong>expressed</strong> (oral or written), <strong>implied</strong> (holds out arm; unconscious emergency), <strong>minors</strong> (parent/guardian). Threaten = <strong>assault</strong>; touch without consent = <strong>battery</strong>.",
  "Pretest: <strong>fasting 8–12 h</strong>, water only (BMP, glucose, albumin, cholesterol). <strong>Basal state</strong> = fasting + no exercise 12 h, rest 15–30 min. Not compliant → contact provider, document.",
  "Interview: <strong>fainting history</strong>, <strong>latex/tape allergy</strong> (nitrile, non-latex supplies), <strong>blood thinners</strong> (warfarin, Coumadin, aspirin → smaller needle, longer pressure).",
  "TDM: <strong>peak</strong> = highest (IV 30 min after, IM 1 hr, oral 1–2 hr). <strong>Trough</strong> = lowest, <strong>within 15 min before</strong> the next dose. Verify the schedule with the nurse.",
  "Position: inpatient lying; outpatient in the chair, arm <strong>fully extended, palm up</strong>. <strong>Never</strong> standing, on a high stool, or on the edge of an exam table."]},
 {h:"Vocabulary",items:[
  "<strong>Lumen</strong>: hollow core of the vein. <strong>Transfix</strong>: through both sides. <strong>Bevel</strong>: slanted needle tip.",
  "<strong>Hemolysis</strong>: RBC destruction. <strong>Hemostasis</strong>: stopping blood flow. <strong>Hematocrit</strong>: % packed RBCs. <strong>Iatrogenic anemia</strong>: anemia from drawing too much blood over time.",
  "<strong>Plasma</strong>: liquid the cells float in. <strong>Serum</strong>: straw-colored liquid after clotting and spinning.",
  "<strong>Lateral</strong> toward the side · <strong>medial</strong> toward the middle · <strong>dorsal</strong> toward the back.",
  "<strong>Pathogen</strong>: disease-causing microorganism. <strong>Sputum</strong>: fluid coughed from lungs. <strong>Ergonomics</strong>: arranging things to work efficiently and safely. <strong>Dermal puncture</strong>: finger or heel lancet stick."]}
]},
{n:2,title:"Safety, First Aid, the Heart & Blood",tag:"Safety & Blood",src:"Day 2 slides · textbook pp. 23–27 & 30–35",confirmed:true,notes:[
 {h:"Agencies & laws",items:[
  "<strong>OSHA</strong> regulates workplace safety and enforces the <strong>Bloodborne Pathogen Standard</strong>. Employers must offer the <strong>Hep B vaccine within 10 days of hire, free</strong>. Gloves whenever blood contact is likely.",
  "<strong>The Joint Commission</strong> accredits healthcare organizations, shapes the <strong>standard of care</strong>, and sets the <strong>National Patient Safety Goals</strong>: 2 identifiers, <strong>full name + DOB or MRN</strong>.",
  "<strong>CLSI</strong> writes lab guidelines and <strong>created the order of draw</strong>. <strong>CDC</strong> tracks diseases and recommends standard precautions, PPE, sharps and hand-hygiene rules. <strong>NIOSH</strong> researches workplace safety. <strong>CLIA</strong> sets lab quality, test management and personnel proficiency.",
  "<strong>HIPAA</strong> protects <strong>PHI</strong>: names, addresses, phone numbers, medical numbers, diagnoses, lab results, prescriptions. Don’t discuss patients in public.",
  "<strong>NSSPA (2000)</strong> requires safety devices, with employees helping choose them. <strong>Standard precautions</strong>: treat every patient and body fluid as infectious."]},
 {h:"Documentation & reporting",items:[
  "Write in <strong>ink</strong>, legibly, every field complete. HIPAA covers any document with PHI.",
  "OSHA exposure report: how it happened, by what means, equipment, its safety feature, PPE worn, location, procedure, and the situation around it.",
  "<strong>Sharps injury log</strong>: date, equipment, <strong>brand name</strong>, department, brief description."]},
 {h:"Controls & containers",items:[
  "Six ways to reduce exposure (textbook): <strong>engineering controls</strong>, <strong>work practice controls</strong>, <strong>housekeeping</strong>, free <strong>Hep B vaccine</strong>, free <strong>annual training</strong>, <strong>isolation</strong>.",
  "<strong>Engineering controls</strong> = equipment that reduces exposure: safety needles, sharps containers, SDS, NFPA labels, biohazard labels, transfer devices. Never recap, reuse or bend needles.",
  "<strong>Work practice</strong>: handwashing, no food/drink/makeup/contacts in exposure areas. PPE = gloves, gowns, masks, respirators, lab coats. <strong>Scrubs are not PPE.</strong>",
  "<strong>Housekeeping</strong>: clean spills right away with <strong>1:10 bleach</strong> (sodium hypochlorite). Textbook: mix it fresh every 24 hours.",
  "<strong>NFPA label</strong>: 0–4 (4 = most extreme). <strong>Blue health</strong> · <strong>red fire</strong> · <strong>yellow instability</strong> · <strong>white specific hazard</strong>. <strong>SDS</strong>: a chemical’s hazards, precautions and what to do after exposure.",
  "Sharps container: leak- and puncture-resistant, within reach, <strong>below eye level</strong>, visible fill line and biohazard symbol, one-handed use. Replace at <strong>two-thirds full</strong>.",
  "Biohazard bags (red or orange) for non-sharp items heavily soiled with blood. Not necessarily leakproof; nothing that could tear them."]},
 {h:"Injuries",items:[
  "Biggest needlestick risk: <strong>Hepatitis B (HBV)</strong>.",
  "<strong>Needlestick</strong> (slides): <strong>wash with soap and water 30 seconds</strong> → notify supervisor → sharps injury log → medical exam (the patient is tested too). Your textbook p. 23 says “induce bleeding” first; the slides don’t.",
  "<strong>Chemical splash</strong>: rinse <strong>at least 15 minutes</strong> → report → exam. <strong>Cut</strong>: flush with water → soap and water → notify → medical care. <strong>Electrical shock</strong>: <strong>shut off power</strong> → remove coworker from contact → notify / 911."]},
 {h:"Isolation & PPE",items:[
  "<strong>Airborne</strong> (particles &lt;5 microns): <strong>N95</strong>. Varicella (chickenpox), <strong>TB</strong>, measles.",
  "<strong>Droplet</strong> (&gt;5 microns): <strong>face mask</strong>. Rubella, meningitis, influenza, pneumonia, scarlet fever, strep throat.",
  "<strong>Contact</strong>: <strong>gloves and gown</strong>. C. diff, cutaneous diphtheria, scabies.",
  "<strong>Neutropenic (reverse) isolation</strong> protects the <strong>patient</strong>: chemotherapy, transplant recipients.",
  "Textbook’s older names: strict (bring out only the blood), enteric (Salmonella; gloves, gown, mask), AFB/TB room with special ventilation.",
  "Nosocomial = hospital-acquired (≥5% of patients). Textbook chain: <strong>source/agent → mode of transmission → susceptible host</strong>. Infection Control also watches immunocompromised patients (chemo, HIV).",
  "PPE on: <strong>gown → mask → goggles → gloves</strong>. Off: <strong>gloves → goggles → gown → mask</strong>. Turn the first glove inside out. Goggles when <strong>aliquoting</strong> blood or urine; gloves when loading the centrifuge."]},
 {h:"Hand hygiene",items:[
  "Hand hygiene is the <strong>most effective way to prevent infection</strong>.",
  "When: entering/leaving work areas, after body-fluid contact, before and after procedures, eating, restroom.",
  "Lather <strong>at least 15 seconds</strong> (slides), hands pointed <strong>down</strong>, turn the faucet off with a <strong>dry paper towel</strong>."]},
 {h:"First aid & fire",items:[
  "Patient passes out: <strong>stop the draw, pressure on the site</strong>, help them to the floor or reclined. Watch breathing, keep talking, never leave them, nothing to eat or drink right away. Call for help if they stay unresponsive.",
  "CPR: <strong>call for help (activate EMS) first</strong> → find an AED → heel of hand on the sternum → <strong>30 compressions</strong> at <strong>100–120/min</strong>, depth 1.5–2.0″ (slides) → <strong>2 breaths</strong> → repeat. Infant: two fingers (index and middle), 1.5″.",
  "Brain damage after <strong>4–6 minutes</strong> without oxygen. Recovery position: <strong>lateral recumbent</strong> (if no spinal injury).",
  "Fire: <strong>A</strong> wood/paper · <strong>B</strong> gas, oil, paint · <strong>C</strong> live electrical · <strong>D</strong> metals · <strong>K</strong> cooking oils."]},
 {h:"The heart & vessels",items:[
  "Fist-sized, hollow, muscular. The <strong>medulla</strong> controls it through the autonomic nervous system. Wrapped by the <strong>pericardium</strong>.",
  "Layers: <strong>epicardium</strong> (outer), <strong>myocardium</strong> (middle, muscle), <strong>endocardium</strong> (inner). Four chambers: <strong>atria</strong> on top, <strong>ventricles</strong> below. SA node, AV node, bicuspid, pulmonary and aortic valves.",
  "One heartbeat = one <strong>cardiac cycle</strong>: atrial contraction, ventricular contraction, recovery. Slides: <strong>60–80 beats/min</strong>.",
  "<strong>Arteries</strong> carry oxygenated blood away from the heart and <strong>have a pulse</strong>. <strong>Veins</strong> carry deoxygenated blood back and have <strong>valves</strong>. Arterioles and venules are the small ones. <strong>Capillaries</strong> are the smallest and hold both.",
  "BP by <strong>sphygmomanometer</strong>; normal <strong>120/80</strong> (systolic pumping / diastolic resting)."]},
 {h:"Blood",items:[
  "<strong>55% plasma</strong> (water with nutrients, antibodies, hormones, proteins) · <strong>45% formed elements</strong>: about 99% RBCs; WBCs + platelets under 1% (the <strong>buffy layer</strong>).",
  "<strong>RBC = erythrocyte</strong>: carries O₂, lives <strong>120 days</strong>. <strong>WBC = leukocyte</strong>: neutrophil (bacteria, fungi), lymphocyte (immunity), monocyte (debris), eosinophil (parasites), basophil (histamine). <strong>Platelet = thrombocyte</strong>: starts clotting.",
  "<strong>Hematocrit</strong> = % RBCs. Low = <strong>anemia</strong>. High = <strong>polycythemia vera</strong>. Therapeutic phlebotomy treats polycythemia vera and <strong>hemochromatosis</strong>.",
  "CBC: RBC, WBC, PLT, HCT, HGB. DIFF counts the WBC types by percent.",
  "Hemostasis: <strong>vascular</strong> (constrict) → <strong>platelet</strong> plug → <strong>coagulation</strong> (fibrin clot) → <strong>clot retraction</strong> → <strong>fibrinolysis</strong> (clot dissolves). Pressure on a draw site speeds clotting.",
  "Clotting factors (memorize): “<strong>F</strong>oolish <strong>P</strong>eople <strong>T</strong>ry <strong>C</strong>limbing <strong>L</strong>ong <strong>S</strong>lopes <strong>A</strong>fter <strong>C</strong>hristmas, <strong>S</strong>ome <strong>P</strong>eople <strong>H</strong>ave <strong>F</strong>allen.”",
  "<strong>I</strong> fibrinogen · <strong>II</strong> prothrombin · <strong>III</strong> thromboplastin (tissue factor) · <strong>IV</strong> calcium · <strong>V</strong> labile factor · <strong>VII</strong> stable factor · <strong>VIII</strong> antihemophilic factor A · <strong>IX</strong> Christmas factor · <strong>X</strong> Stuart-Prower factor · <strong>XI</strong> plasma thromboplastin antecedent · <strong>XII</strong> Hageman factor · <strong>XIII</strong> fibrin-stabilizing factor. There is <strong>no factor VI</strong>. (This is the correct list; the textbook’s numbering on p. 34 is off after IV.)",
  "<strong>Plasma</strong>: anticoagulant tube, still has <strong>fibrinogen</strong>. <strong>Serum</strong>: red, gold, tiger, orange; clots <strong>30–60 min</strong>. Spun too soon → fibrin strands; don’t aliquot the clot. EDTA and citrate <strong>bind calcium</strong>; heparin <strong>inactivates thrombin</strong>.",
  "Body systems: skin is the <strong>largest organ</strong>; <strong>bone marrow</strong> makes blood cells. Heart tests: troponin, CK-MB, lipids. Kidneys: BUN, creatinine. Endocrine → endocrinology."]},
 {h:"Blood types & donation",items:[
  "Type A has A antigen, B has B, <strong>AB both</strong>, <strong>O neither</strong>. <strong>Rh</strong> = protein on RBCs (+ or −). <strong>O− universal donor</strong>, <strong>AB+ universal recipient</strong>.",
  "Donation: <strong>18-gauge</strong> needle. Blood bank labels in front of the patient, recheck against the armband (mislabeling can be fatal). Bag <strong>below the arm</strong>. Partial bag → <strong>new bag, never combine</strong>. Donor opens and closes the hand gently.",
  "Donors: <strong>17+</strong>, <strong>over 110 lb</strong>, <strong>56 days</strong> between donations. Apheresis: men 130+ lb and 61″+; women 150+ lb and 65″+. Must be healthy, full history, clear of HIV and hepatitis.",
  "<strong>Apheresis</strong> removes one blood component; <strong>plasmapheresis</strong> removes plasma and returns the rest. <strong>Autologous</strong>: own blood, provider order, <strong>Hgb ≥ 11 g/dL</strong>, surgery <strong>more than 72 hours</strong> later.",
  "<strong>Iatrogenic anemia</strong>: limit draws to <strong>1–5% of blood volume per 24 h</strong>, or <strong>10% over 8 weeks</strong> for kids and critically ill. Infant volume: <strong>lb ÷ 2.2 = kg → × 100 = mL → ÷ 1000 = L</strong> (8.5 lb → 0.38 L)."]},
 {h:"Vocabulary",items:[
  "<strong>Vena cavae</strong>: large veins returning blood to the heart. <strong>Oxygenation</strong>: supplying O₂. <strong>Sympathetic</strong> = stress response; <strong>parasympathetic</strong> = rest and digest.",
  "<strong>Osmosis</strong>: water through a semipermeable membrane. <strong>Diffusion</strong>: high → low concentration. <strong>Filtration</strong>: forcing through a membrane. <strong>Electrolytes</strong>: conduct electricity in water.",
  "<strong>Antigen</strong> triggers an immune response; <strong>antibody</strong> is the protein that neutralizes it. <strong>Fibrinogen</strong> becomes fibrin in a clot.",
  "<strong>Exposure control plan</strong>: OSHA plan to minimize bloodborne exposure. <strong>Quality control</strong>: an instrument giving the same result over time. <strong>Means of transmission</strong>: how a pathogen reaches a host."]}
]},
{n:3,title:"Capillary Punctures, Smears, QC & Communication",tag:"Capillary",src:"Day 3 slides · textbook pp. 50–55, 70–80 & 88–94",confirmed:true,notes:[
 {h:"Capillary punctures",items:[
  "Also called <strong>dermal punctures</strong> or finger/heel sticks. The blood is a mix of <strong>capillary, arterial and venous</strong> blood, so always tell the lab how it was collected.",
  "Do one when: veins are inaccessible (IVs, scars, burns), the test needs a <strong>small amount</strong>, the test needs <strong>capillary blood</strong>, or the patient is at risk for <strong>iatrogenic anemia</strong>.",
  "Slides: preferred for infants <strong>under 1 year</strong> (heel). Adults: <strong>middle or ring finger of the non-dominant hand</strong>. (Textbook p. 70 says microsampling is preferred for all children under 2, and heel sticks under 6 months. Go with your slides.)",
  "Textbook: errors are magnified with tiny samples, blood clots faster, mix right away, and squeezing causes hemolysis."]},
 {h:"Fingerstick",items:[
  "Steps: introduce yourself → identify → <strong>hand below heart level</strong> → wash and glove → gather supplies (70% alcohol, bandage, 2 gauze, lancet, microtube) → check the hand is warm → pick the finger → clean and air-dry → puncture → lancet to sharps → <strong>wipe the first drop</strong> → let drops fall into the tube → cap and <strong>invert 10 times</strong> → gauze → <strong>label before leaving</strong> → bandage when bleeding stops → thank and observe.",
  "Finger choice: <strong>middle or ring</strong> (3rd or 4th). Not the <strong>thumb</strong> (pulse), <strong>pinky</strong> (thin, bone close), or <strong>index</strong> (sensitive or calloused). Use the fleshy, <strong>off-center</strong> side; the tip is sensitive with fewer capillaries.",
  "Cut <strong>perpendicular to the fingerprint lines</strong> so a round drop forms. Parallel cuts make blood run down the finger.",
  "Never use a finger that is cold, <strong>cyanotic</strong> (blue), scarred, swollen, rashy or thickly calloused.",
  "Cold hands: open and close the hand, rub hands together, hand below the heart for 30 seconds, or wash in warm water.",
  "Slow flow: lower the hand and use gentle <strong>press-and-release</strong> at the first joint. <strong>Don’t scoop or milk.</strong> No more than <strong>2 minutes</strong> per tube.",
  "<strong>Never use povidone-iodine</strong> for a dermal puncture: it can <strong>falsely raise potassium</strong>."]},
 {h:"Heel stick (infants under 1 year)",items:[
  "Infant veins are too small for venipuncture and fingers don’t have enough tissue.",
  "Steps: identify → wash and glove → gather (heel warmer, alcohol, lancet <strong>no deeper than 2.0 mm</strong>, 2 gauze, microtainer) → position <strong>supine</strong> if possible → <strong>warm 3–5 minutes</strong> → site → clean and air-dry → puncture and squeeze gently → <strong>wipe the first drop</strong> → let blood <strong>drip passively</strong> into the tube → if flow stops, wipe surface clots and stop squeezing → pressure → observe → label before leaving → bandage.",
  "Site: <strong>lateral or medial</strong> side (plantar surface). <strong>Not the back of the heel</strong> (too little skin), the arch, the center, toes, or a recent or bruised site.",
  "Textbook: BD lancets are <strong>green 1.0 mm</strong> (full-term) and <strong>pink 0.85 mm</strong> (preemie). Deeper than 2.0 mm risks bone infection (<strong>osteomyelitis</strong>). Warmer <strong>under 40 °C</strong>; warming increases flow up to 7×. Cut across the heel-print grooves.",
  "Don’t milk the heel: it hemolyzes the specimen."]},
 {h:"Microsample order of draw",items:[
  "<strong>Blood gas → lavender → green → serum.</strong>",
  "It differs from venipuncture because <strong>thromboplastin</strong> released by the puncture makes blood clot faster. The order minimizes <strong>platelet clumping and microclots</strong>.",
  "Textbook: lavender microtubes need at least <strong>20 total mixes</strong>; roll so EDTA coats the walls. Touch the tube to the drop; never scrape the skin."]},
 {h:"Newborn screening",items:[
  "State-required blood spots on special cards, collected <strong>within 72 hours of birth</strong>. Collected before <strong>24 hours</strong> of age → collect a <strong>second</strong> specimen (up to 2 weeks).",
  "Screens for: <strong>cystic fibrosis</strong>, <strong>hypothyroidism</strong>, <strong>PKU</strong> (untreated → brain damage), <strong>galactosemia</strong> (can’t convert galactose to glucose), <strong>biotinidase deficiency</strong>, <strong>sickle cell disease</strong>, <strong>HIV</strong>, <strong>toxoplasmosis</strong> (parasites in cat feces or contaminated food).",
  "Fill the form completely in ink (include the parent’s phone number) and check its <strong>expiration date</strong>.",
  "Don’t touch the filter paper. Wipe the first drop. <strong>One large drop completely saturates each circle</strong>, on the <strong>printed side only</strong>. Air-dry <strong>at least 4 hours</strong> at room temperature, away from sunlight and heat."]},
 {h:"Peripheral blood smears",items:[
  "Examines blood cells under a microscope. From a fingerstick, use the <strong>second drop</strong>. From an <strong>EDTA lavender</strong> tube, make the smear <strong>within 1 hour</strong>.",
  "<strong>Wedge method</strong> makes a <strong>feathered edge</strong>. Most labs use an automated slide maker.",
  "Manual: <strong>1 mm drop ½ inch from the edge</strong> → spreader in dominant hand at <strong>30–35°</strong> → back it into the drop → let the blood spread along its edge → one smooth push to the end → label with permanent marker → <strong>air dry, don’t blow</strong>."]},
 {h:"Point-of-care testing",items:[
  "Tests done close to the patient for fast results. Examples: blood glucose, urine dipsticks, urine pregnancy. <strong>Glucose is the most common POCT.</strong> Blood POCT usually uses a dermal puncture.",
  "Textbook: mostly <strong>CLIA-waived</strong> tests (CLIA levels: waived, moderate, high complexity). Pros: fast, fewer people, small. Cons: small samples magnify errors, calibration, timing, batteries, control storage.",
  "Blood POCT: H&H, PT/PTT/ACT, glucose, troponin T, cholesterol, ABG, electrolytes. Non-blood: EKG, occult blood, urinalysis, pregnancy, rapid strep."]},
 {h:"Reference ranges & critical values",items:[
  "<strong>Reference range</strong>: values doctors use to call a result normal or abnormal. <strong>Critical value</strong>: far enough out of range to be an immediate risk; report it <strong>promptly and directly to the ordering provider</strong>.",
  "Slides: <strong>WBC 4.4–11</strong> (thousand/mm³) · <strong>total cholesterol 140–200</strong> mg/dL · <strong>fasting glucose 70–110</strong> mg/dL · <strong>Hgb male 13–17.5</strong>, <strong>female 11.5–15.5</strong> g/dL.",
  "Your POCT handout lists different numbers (glucose 77–99, cholesterol under 200, HDL ≥60, LDL under 100, trig under 149, Na 136–146, Cl 96–106, K 3.5–4.5, Ca 8.6–10.2, Mg 1.7–2.2). Ranges vary by lab; answer with the source the question names."]},
 {h:"Quality",items:[
  "<strong>Quality control</strong> = precision: an instrument giving consistent results over time. Every instrument has an <strong>equipment log</strong>. Run QC <strong>daily</strong>, when opening a <strong>new lot</strong>, and after repeated errors. Log date, time and results.",
  "Glucometer: external controls daily, on a new lot, or when results look way off; at room temperature, not expired. Out of range → repeat; <strong>never test patients</strong> until controls pass. Log time, date, results and the meter’s <strong>serial number</strong>. Strips: room temperature, dry, package closed, not expired. Clean with an <strong>alcohol wipe</strong> after each use. Replace low batteries.",
  "Textbook: <strong>QA</strong> = ongoing policies and procedures (e.g., tracking recollection rates). <strong>QC</strong> = checks right now (fridge temps, POCT controls). TQM and CQI. JCAHO: procedure manuals reviewed <strong>annually</strong>.",
  "<strong>70–80%</strong> of medical decisions rely on lab results. The phlebotomist owns the <strong>pre-analytical phase</strong>. A valid result is accurate and reproducible.",
  "Error sources: ID errors (most important step), paperwork, patient prep (fasting, meds stopped <strong>4–24 h</strong> before), positioning, clotting, fainting, timing, asepsis, wrong equipment, hemolysis, tourniquet over 1 min, order of draw, transport and temperature (<strong>wet ice</strong> = ice + water), light (bilirubin, beta carotene, vitamins A and B6), broken tubes, processing (<strong>aliquots</strong>; separate within 30 min, never over 2 h), storage."]},
 {h:"Communication",items:[
  "<strong>Communication cycle</strong>: sender → message → receiver → <strong>feedback</strong> (the last step; shows whether it was understood).",
  "Styles: <strong>intuitive</strong> (big picture) · <strong>analytical</strong> (facts, numbers) · <strong>functional</strong> (step-by-step plans) · <strong>personal</strong> (feelings, emotional language).",
  "<strong>Active listening</strong> is the most fundamental part: smile, eye contact, upright posture, paraphrase back, respect personal space.",
  "Verbal = spoken words. <strong>Nonverbal</strong> = gestures, facial expressions, posture, eye contact, touch, personal space, appearance.",
  "<strong>Therapeutic communication</strong> builds comfort, safety and trust using words the patient understands. Avoid: advising, agreeing/disagreeing, defending, disapproving, giving approval, stereotyping, minimizing feelings, probing, <strong>reassuring</strong>.",
  "Barriers: language, culture, cognitive level, developmental stage, sensory and physical challenges. Use written instructions when possible.",
  "<strong>Hearing loss</strong>: face them, keep your face lit and mouth visible, no background noise, get attention first, speak clearly, <strong>don’t shout</strong>, offer an interpreter. <strong>Vision loss</strong>: explain everything out loud, escort them, solid backgrounds, offer Braille, large print or audio (under 10% of blind people read Braille). Older adults need more time. <strong>Service animals are not pets.</strong>",
  "Giving verbal results to staff, document: patient name, ID number, <strong>receiver’s name</strong>, date, time, result details, and where it came from. <strong>Only the ordering provider</strong> discusses results with the patient."]},
 {h:"Different patients (textbook pp. 88–94)",items:[
  "Newborns: parent holds. Toddlers 12–24 mo: <strong>fear separation</strong>, draw minimum volume, EMLA option. Preschool 3–6: simple directions, praise. School age 7–12: <strong>fear loss of control</strong>. Teens 13–18: may not want a parent present, hide fear. Geriatric 70+: <strong>don’t rush</strong>.",
  "Elderly: thin skin, bruising, less elastic veins. Address as <strong>Mr./Ms.</strong>, never “honey.” Hearing loss ≠ mental impairment. BP cuff or tourniquet over clothing, <strong>avoid adhesive tape</strong>, smaller needles and tubes. Document how a confused patient was identified.",
  "Phlebotomists <strong>don’t draw from VADs or fistulas</strong>. Edema: try another site; don’t probe. Fragile veins: syringe or pediatric tubes. Bleeding won’t stop → <strong>don’t let them leave</strong>, call for help.",
  "Allergies: iodine, alcohol, latex, adhesives. Darker skin: find veins by touch. Sick? Stay home if contagious; mask if still coughing. Top nosocomial sites: <strong>urinary tract, wounds, respiratory</strong>."]},
 {h:"Lab informatics",items:[
  "<strong>Manual</strong> = human interaction · <strong>semi-automated</strong> = little to no human interaction · <strong>automated</strong> = humans only for errors.",
  "Enter: patient ID, ordering provider, test ordered, date/time/source of collection, special notes, insurance or billing."]},
 {h:"Vocabulary",items:[
  "<strong>CLIA-waived</strong>: least complex tests, low risk of error. <strong>Control material</strong>: a sample with known values run before patient samples. <strong>Empathy</strong>: sensitivity to another’s problems without expressing sorrow or sympathy.",
  "<strong>Peripheral blood smear</strong>: thin layer of blood on a slide, stained for the microscope. <strong>Capillary puncture</strong>: dermal puncture or fingerstick.",
  "<strong>Cystic fibrosis</strong>: mucus builds up in organs. <strong>Hypothyroidism</strong>: low thyroid function. <strong>Sickle cell</strong>: abnormal hemoglobin. <strong>Biotinidase deficiency</strong>: can’t break down biotin."]}
]},
{n:4,title:"Non-Blood Specimens & Blood Cultures",tag:"Specimens",src:"Day 4 slides · textbook pp. 83–86 & 109",confirmed:true,notes:[
 {h:"Non-blood specimens: the basics",items:[
  "Most non-blood specimens are <strong>not collected by phlebotomists</strong>; many are collected by the patient (urine, stool). Your job is making sure the patient <strong>understands the instructions</strong>.",
  "Verify the patient with <strong>two identifiers</strong> before handing out a container. Use Standard Precautions.",
  "Put the label on the <strong>container, not the lid</strong> (a tech may have several lids off at once).",
  "Label: <strong>first and last name · DOB · date · time · collector’s initials · source/type of sample</strong>."]},
 {h:"Urine",items:[
  "Routine <strong>urinalysis</strong> is one of the most common non-blood tests: appearance, color, odor, pH, specific gravity, protein, glucose, hemoglobin and more. Textbook: urine is the most frequently analyzed non-blood fluid.",
  "<strong>Midstream clean catch</strong> (most urine tests): sterile container, nothing but urine touches the inside → wash hands → clean the urinary meatus with mild antiseptic or <strong>benzalkonium chloride</strong> wipes → start urinating in the toilet → catch the <strong>middle</strong> until the cup is <strong>¼ to ½ full</strong>.",
  "<strong>Urine culture</strong>: checks for bacteria (UTI). Clean catch or catheter → urine culture tube, <strong>room temperature up to 72 hours</strong>. Not preserved and delayed → refrigerate.",
  "<strong>Random</strong>: any time, <strong>30–60 mL</strong>, no prep. Collected at home → refrigerate, bring in ASAP.",
  "<strong>First voided (first morning)</strong>: urinate before bed, collect right after waking. <strong>More concentrated</strong>, so used for tests like <strong>pregnancy</strong> (textbook: more hCG). Refrigerate.",
  "<strong>24-hour urine</strong> (kidney function): rigid, light-resistant, wide-mouth, leakproof, about <strong>3,000 mL</strong>. <strong>Discard the first morning void</strong>, collect everything for 24 hours, and the <strong>next morning’s first void is the last one collected</strong>. <strong>Refrigerate</strong> the whole time. Drink a normal amount of fluid.",
  "<strong>Urine drug screen</strong>: random, may be monitored, often with a <strong>chain of custody</strong> form (legal use; must be complete). Temperature <strong>32–38 °C (90–100 °F)</strong>, checked <strong>within 4 minutes</strong>. At least <strong>45 mL</strong>. Textbook: urine is preferred because many drugs show in urine but not blood.",
  "<strong>Postprandial urine</strong>: urinate, eat a prescribed carbohydrate meal or glucose drink, collect <strong>2 hours later</strong>. Diabetics: checks the insulin dose. Non-diabetics: screening.",
  "Textbook: infants not potty-trained → <strong>plastic urine collection bag</strong>."]},
 {h:"Urine dipstick (reagent strip)",items:[
  "Dip for the time the test requires, remove, and <strong>match the pad colors</strong> to the chart on the bottle.",
  "<strong>pH 5.5–8.0</strong> (per slides): acid vs alkaline; rises if urine isn’t refrigerated. <strong>Specific gravity 1.003–1.030</strong>: concentration; high can mean dehydration.",
  "<strong>WBC & nitrites</strong> → infection · <strong>hemoglobin</strong> → bleeding, infection, cancer, kidney disease, poisoning · <strong>ketones</strong> → diabetes, starvation, vomiting · <strong>bilirubin</strong> → liver disease or RBC destruction · <strong>protein</strong> → inflammation, infection, kidney disease · <strong>glucose</strong> → diabetes."]},
 {h:"Stool, FOBT, semen",items:[
  "<strong>Stool</strong>: bacteria, parasites, blood. Collect in a clean container and transfer with a tongue depressor or spoon. <strong>No urine</strong> (it stops microorganism growth; textbook: urinate first) and <strong>no toilet water</strong>. A small amount is enough. Lid tight, wash hands. <strong>Parasite (O&P) samples: don’t refrigerate</strong>; return ASAP.",
  "<strong>FOBT</strong> (fecal occult blood) is the most common stool POCT: hidden blood → ulcers, <strong>colorectal cancer</strong>. Kit = card, instructions, mailer. Usually <strong>3 days</strong> of samples (textbook: 2–3). High-fiber diet, but <strong>no red meat, citrus or raw vegetables</strong>; <strong>no ibuprofen, vitamin C or aspirin for 3 days</strong>. Not from the toilet water (container or toilet tissue OK). Card stays at <strong>room temperature</strong>.",
  "<strong>Semen</strong>: fertility, rape cases, vasectomy check. Abstain <strong>2–7 days</strong>. Sterile container; label with date and time. <strong>No condom</strong> (spermicide). Keep <strong>warm, out of light</strong>, to the lab <strong>within 1 hour</strong>, at <strong>36–38 °C</strong>. <strong>Never refrigerate</strong> (lowers the count). Textbook says room temperature."]},
 {h:"Swabs, sputum, saliva",items:[
  "<strong>Buccal swab</strong>: inside of the cheek, for <strong>DNA</strong>. Rub gently, label in front of the patient.",
  "<strong>Throat swab</strong>: usually <strong>strep throat</strong>. Swab both tonsils, the back of the throat and inflamed areas. <strong>Wear a mask.</strong>",
  "<strong>Sputum</strong>: coughed up from lungs, trachea, bronchi (TB, pneumonia; checks treatment). Best <strong>first thing in the morning</strong> (more concentrated, more volume), before or hours after eating. Sterile container, deep breath, cough. <strong>No saliva.</strong> <strong>1–2 teaspoons.</strong>",
  "<strong>Saliva</strong>: hormone (e.g., cortisol), alcohol and drug levels. Follow the kit; label in front of the patient."]},
 {h:"Blood cultures: why",items:[
  "Check for bacteria or other microorganisms in the blood. Ordered for <strong>fever of unknown origin (FUO)</strong>. Processed by <strong>microbiology</strong>; growth tells doctors which <strong>antibiotic</strong> works.",
  "Textbook: suspect <strong>septicemia</strong> (blood infection) or <strong>bacteremia</strong> (caused by bacteria). Blood should be <strong>sterile</strong>. Bottles are watched <strong>5 days</strong>.",
  "Ordered in <strong>multiple sets</strong> at different times and sites to catch the organism. Doctor sets the timing; <strong>no time given → wait 15 minutes</strong> between sets. <strong>Different site for each set.</strong> Other tubes? Follow the order of draw; no second stick.",
  "Example: blood cultures ×2 → set 1 right cephalic at 5:00 pm, set 2 left basilic at 5:15 pm."]},
 {h:"Blood cultures: equipment",items:[
  "Each set: <strong>2 bottles (aerobic + anaerobic)</strong> or <strong>2 yellow SPS tubes</strong>. Pediatric: <strong>1 bottle</strong>, <strong>1–3 mL</strong> (textbook: aerobic only). Adult bottles: <strong>8–10 mL</strong>. Don’t underfill or overfill.",
  "<strong>Aerobic</strong> = microbes that thrive in air. <strong>Anaerobic</strong> = airless.",
  "Usually a <strong>butterfly</strong>; syringes OK with a <strong>sterile safety needle</strong>.",
  "Bottle order: <strong>butterfly → aerobic first</strong>; <strong>syringe → anaerobic first</strong>. Only enough for one bottle → <strong>aerobic</strong>.",
  "Textbook: on antibiotics → <strong>ARD bottle</strong> (resins) in place of the aerobic. Never draw cultures from an <strong>IV line</strong>. Bottles aren’t inverted."]},
 {h:"Blood cultures: skin prep (slides)",items:[
  "Same as routine venipuncture except the cleaning. After finding the vein:",
  "1) Clean the <strong>bottle or SPS tops with 70% alcohol</strong>; air-dry.",
  "2) Scrub the skin with <strong>70% alcohol, back and forth, 1 minute</strong>, about <strong>2.5 in (6.35 cm)</strong> across; air-dry.",
  "3) Scrub with a <strong>second disinfectant</strong> (iodine or <strong>chlorhexidine gluconate</strong>) back and forth <strong>1 minute</strong>; let it dry before the stick.",
  "<strong>Iodine or shellfish allergy → chlorhexidine.</strong> <strong>Don’t re-palpate.</strong> Tourniquet never over <strong>1 minute</strong> (textbook: release it during the cleaning, re-tie 3–4 in above).",
  "After: observe the site up to <strong>10 seconds</strong> after releasing pressure and removing gauze.",
  "Textbook contamination causes: alcohol or iodine not dry, re-palpating with a non-sterile finger, not prepping SPS tops. One contaminated culture can cost <strong>$5,000</strong>."]},
 {h:"Helping other staff",items:[
  "Notify the right lab staff, gather all materials, explain the procedure to the patient.",
  "Two sets on one patient → <strong>two complete sets of equipment</strong>. Never reuse antiseptic pads, gauze or needles."]},
 {h:"Vocabulary",items:[
  "<strong>Stool</strong>: solid waste eliminated through the anus. <strong>Cerebrospinal fluid</strong>: surrounds the brain and spinal cord. <strong>Amniotic fluid</strong>: surrounds a fetus. <strong>Urinary catheter</strong>: tube into the bladder to drain urine.",
  "<strong>pH</strong>: low = acidic, high = alkaline. <strong>Specific gravity</strong>: concentration. <strong>Ketones</strong>: acids from fat breakdown without insulin. <strong>Bilirubin</strong>: yellow-orange product of hemoglobin breakdown.",
  "<strong>Random urine</strong>: any time, no prep. <strong>Clean-catch midstream</strong>: prevents bacterial contamination. <strong>Culture and sensitivity</strong>: checks for UTI. <strong>GTT</strong>: how well the body metabolizes sugar. <strong>Postprandial</strong>: after a meal.",
  "<strong>Saliva test</strong>: hormone, drug, alcohol levels. <strong>Fecal test</strong>: parasites, blood, infection. <strong>Chlorhexidine gluconate</strong>: antiseptic for skin prep."]}
]},
{n:5,title:"Quality & Specimen Integrity",tag:"Quality",src:"Textbook Modules 5, 6, 7, 8 & 13",notes:[{h:"Specimen types",items:[
  "<strong>Venous</strong> (most used), <strong>arterial</strong> (blood gases; textbook says 90° stick, ≥10 min pressure; usually respiratory therapists), <strong>capillary</strong> (arterial + venous mix; tell the lab).",
  "Whole blood when cells are needed (CBC, blood bank). Coag factors → <strong>light blue plasma</strong>. Most chemistry and immunology → <strong>serum</strong>. EDTA can’t be used for calcium.",
  "SPS stops immune components from killing bacteria. Gray fluoride stabilizes glucose. SST gel separates serum from cells."]},
 {h:"Good vs. bad samples",items:[
  "Normal serum/plasma: clear to pale yellow. <strong>Hemolyzed</strong>: clear red/pink, raises potassium. <strong>Icteric</strong>: brown-green (adults), orange-brown (babies), high bilirubin. <strong>Lipemic</strong>: cloudy/milky, often not fasting.",
  "Icteric and lipemic reflect the <strong>patient</strong>; hemolysis is usually a <strong>collection</strong> problem."]},
 {h:"Lab sections",items:[
  "<strong>Anatomic (surgical) pathology</strong>: cytology, histology, cytogenetics, autopsy. <strong>Clinical pathology</strong>: all CLIA levels (waived, moderate, high complexity).",
  "<strong>Microbiology</strong> (cultures, C&S) · <strong>Immunohematology</strong> = blood bank (regulated by CAP, FDA, AABB) · <strong>Immunology = serology</strong> (ANA lupus, RPR syphilis, mono) · <strong>Hematology</strong> (CBC most ordered, DIFF, ESR, retic) · <strong>Coagulation</strong> (PT monitors Coumadin; APTT monitors heparin) · <strong>Chemistry</strong> panels · urinalysis · molecular.",
  "DIFF smear: spreader at about <strong>30°</strong> (appendix: 30–35°). Routine UA and pregnancy tests: <strong>first morning</strong> sample is best."]},
 {h:"People & tests",items:[
  "CLS/MT: bachelor’s + clinical · CLT/MLT: associate · Pathologist: MD (lab director) · Phlebotomist: high school + training.",
  "BUN/creatinine → kidneys · amylase/lipase → pancreatitis · troponin/CK-MB → heart attack · ESR → inflammation · ANA → lupus · RPR → syphilis.",
  "Glucose: FBS in <strong>gray</strong>. <strong>HbA1c</strong> (lavender, no fasting) = average sugar over <strong>4–6 weeks</strong> per your class (national references say ~2–3 months). Post prandial = after eating.",
  "Terms: NPO nothing by mouth · QNS quantity not sufficient · STAT immediately · fomite = object that harbors bacteria · hematuria = blood in urine · asepsis = without bacteria."]},

 {h:"QA & QC",items:[
  "<strong>QA</strong>: ongoing policies and procedures so samples are always collected right (e.g., tracking recollection rates). <strong>QC</strong>: tasks that check right now (fridge temps, running POCT controls).",
  "TQM = Total Quality Management; CQI = Continuous Quality Improvement. JCAHO requires procedure manuals reviewed <strong>annually</strong>.",
  "<strong>70–80%</strong> of medical decisions rely on lab results. The phlebotomist owns the <strong>pre-analytical phase</strong>. Valid result = accurate and reproducible."]},
 {h:"Sources of error",items:[
  "<strong>Patient ID</strong> is the single most important step; <strong>labeling</strong> is runner-up. Mislabeled specimens must be <strong>rejected and recollected; never relabeled</strong>.",
  "Meds that interfere: stop <strong>4–24 h</strong> before. Exercise can change urine protein. Fill tubes bottom up, arm straight. Warm the site for poor flow.",
  "Hemolysis tips: let alcohol dry, right needle size, never draw through a hematoma, release tourniquet early, secure syringe needle, don’t pull the plunger hard, mix gently.",
  "Hemolysis <strong>falsely raises K, Fe, LD, total protein</strong>. Note it on the requisition. Potassium can look “incompatible with life.”",
  "IV contamination: crystal-clear serum, impossible results. Draw opposite arm or below. Above only if the drip is stopped <strong>≥15 min</strong> (textbook).",
  "Standing blood: <strong>glucose drops, potassium rises</strong>. Process within <strong>30 min</strong> if possible, <strong>never past 2 h</strong>. Splitting a sample = <strong>aliquots</strong>."]},
 {h:"Timing, temperature, light",items:[
  "Diurnal variation: <strong>cortisol</strong> drawn at two set times. Lactate: some labs draw <strong>without stasis</strong> (no tourniquet). Trough per textbook: 30 min before dose (slides say within 15).",
  "<strong>Ammonia</strong>: on ice, to the lab within <strong>15 min</strong> (otherwise it rises). Wet ice = ice + water (blood gases, ammonia).",
  "Light-sensitive: <strong>bilirubin</strong> (light lowers it), beta carotene, vitamins A and B6, protoporphyrin. Wrap in foil.",
  "Problems found in the lab: <strong>lipemia, clots, contamination, QNS, interference, hemolysis</strong>. Microclots (RBCs are 5–8 microns) are caught by instruments."]}
]},
{n:6,title:"Microsampling & Point of Care",tag:"Capillary",src:"Textbook Modules 9 & 10 · POCT handout",notes:[
 {h:"When to microsample",items:[
  "Preferred for <strong>all children under 2</strong>. Adults: no usable vein, burns/scars, chemo patients, fragile elderly veins, POCT. Infants ≤1 yr, elderly, underweight → avoid <strong>iatrogenic anemia</strong>.",
  "Errors are magnified, blood clots faster, mix immediately, squeezing causes hemolysis, and capillary ≠ venous (note the source)."]},
 {h:"Heel stick (infants under 6 months)",items:[
  "BD quick heel lancet: <strong>green full-term 1.0 mm</strong> depth, <strong>pink preemie 0.85 mm</strong>. Depth must be <strong>under 2.0 mm</strong> to avoid bone (osteomyelitis).",
  "Warm <strong>3–5 min, under 40 °C</strong>; increases flow up to 7×. Head slightly raised.",
  "Site: <strong>medial or lateral plantar surface</strong>. Avoid back curve, arch, center of heel, toes, cold/blue, scarred, rash, swollen, previous or infected sites.",
  "Clean with 70% alcohol, air dry, don’t touch. Cut <strong>across the heel-print grooves</strong>. <strong>Wipe the first drop</strong> (tissue fluid).",
  "Capillary order: <strong>blood gas → lavender → green → serum</strong>. Invert 8–10; lavender at least <strong>20 total</strong> (roll it). Never scrape the skin. If flow stops, wipe surface clots and stop squeezing.",
  "Label 5 items before leaving. Foil for bilirubin. Return the infant to the original position."]},
 {h:"Fingerstick & newborn screen",items:[
  "<strong>Middle or ring finger</strong>, non-dominant hand, fleshy pad slightly off center, <strong>across the fingerprint</strong>. Avoid rings, cold, swollen, IV side. Hand down, wipe first drop.",
  "PKU and state screens on a <strong>Guthrie card</strong>, after <strong>24 h</strong> of age. One large drop fully saturates each circle; air dry ~3 h flat and elevated.",
  "Rejected: over-saturated, unfilled circles, expired form, received after 14 days, contaminated, not dried."]},
 {h:"Point of care testing",items:[
  "Testing at the patient’s side. Mostly <strong>CLIA-waived</strong> tests. Pros: fast, fewer people, small, easy. Cons: small samples magnify errors, calibration, timing, battery, storage of controls.",
  "Blood POCT: H&H, PT/PTT/ACT, glucose, troponin T, cholesterol, ABG, electrolytes. Non-blood: EKG, occult blood, urinalysis, pregnancy, rapid strep.",
  "QC for waived tests: confirm orders, ID, follow package inserts, no expired reagents, run controls and log them. <strong>Critical values</strong>: call immediately, document who took it, date and time.",
  "Handout ranges: total cholesterol <strong>&lt;200</strong> · HDL <strong>≥60</strong> · LDL <strong>&lt;100</strong> · trig <strong>&lt;149</strong> · glucose <strong>77–99</strong> mg/dL · Na <strong>136–146</strong> · Cl <strong>96–106</strong> · K <strong>3.5–4.5</strong> mmol/L · Ca <strong>8.6–10.2</strong> · Mg <strong>1.7–2.2</strong> mg/dL."]}
]},
{n:7,title:"Blood Cultures, Special Patients & Handling",tag:"Special",src:"Textbook Modules 11, 12 & 14",notes:[
 {h:"Blood cultures",items:[
  "For <strong>fever of unknown origin</strong>: septicemia (blood infection) or bacteremia (bacteria). Blood should be sterile.",
  "Typical order: <strong>x3 sets, 30 min apart</strong>, different sites, timed before a fever spike. Each set = <strong>aerobic + anaerobic</strong> (2 SPS tubes or 2 bottles). On antibiotics → <strong>ARD bottle</strong> instead of aerobic.",
  "Site prep is the most important step. Remove the tourniquet while cleaning. <strong>Method 1</strong>: alcohol, then povidone-iodine, concentric circles, dry each pass (iodine allergy → 4 alcohol cleanings). <strong>Method 2</strong>: chlorhexidine, back-and-forth scrub.",
  "Clean the bottle/SPS tops (alcohol only on bottles). Re-palpate only with a finger prepped the same way. Remove iodine from skin afterward.",
  "Contamination: alcohol/iodine not dry, unclean re-palpation, tops not prepped. One contaminated culture can cost <strong>$5,000</strong>. Bottles incubate <strong>5 days</strong>. Never draw cultures from a line.",
  "Butterfly → <strong>aerobic first</strong>. Syringe → <strong>anaerobic first</strong>. Only enough for one → <strong>aerobic</strong>. Pediatric bottle is aerobic only."]},
 {h:"Different people",items:[
  "Newborn 0–12 mo: parent holds. Toddler 12–24 mo: fear of separation, minimum volume, EMLA option. Preschool 3–6: simple directions, praise. School age 7–12: fear loss of control. Teens 13–18: may not want parent, may hide fear. Adults 19–69. Geriatric 70+: don’t rush.",
  "Elderly (85+ fastest-growing group): thin skin, bruising, less elastic veins. Address as Mr./Ms. (no “honey”). Hearing loss ≠ mental impairment; speak to the good ear.",
  "Elderly tips: BP cuff or tourniquet over clothing, <strong>avoid adhesive tape</strong>, smaller needles and tubes, syringe or butterfly. Document how a confused patient was identified.",
  "Phlebotomists don’t draw from VADs or <strong>fistulas</strong>. Edema: try another site; don’t probe. Bleeding won’t stop → <strong>don’t let them leave</strong>, call for help.",
  "Allergies: iodine, alcohol, latex, adhesives. Darker skin: find veins by palpation."]},
 {h:"Special handling quick reference",items:[
  "Fasting: lipid profile, GTT. Timed: GTT, blood cultures, TDM. Diurnal: ACTH, aldosterone, cortisol, eosinophil, insulin, iron, renin, TSH, T4.",
  "No stasis: <strong>lactate</strong>. Chain of custody: paternity, rape kits, criminal DNA.",
  "Light: <strong>bilirubin, B12, B6, folic acid</strong>. Cold water: <strong>ammonia, blood gases, gastrin, lactic acid, renin</strong>. Body temp: <strong>cold agglutinins</strong> (pre-warm tubes), <strong>cryoglobulins</strong>.",
  "STAT to lab: ammonia, ABG, lactate. Glucose: remove cells quickly.",
  "Shipping infectious material: watertight inner, absorbent, watertight secondary (≥100 mm), outer with labels, “In case of breakage, send to CDC.”"]}
]},
{n:8,title:"Legal, Non-Blood Specimens & Beyond the Draw",tag:"Legal",src:"Textbook Module 15 · appendix",notes:[
 {h:"Legal terms",items:[
  "<strong>Assault</strong>: threatening to touch. <strong>Battery</strong>: touching without consent. <strong>Breach of duty</strong>: failure to perform. <strong>Negligence</strong>: failure to perform to standard. <strong>Malpractice</strong>: professional negligence.",
  "<strong>Standard of care</strong>: what a reasonable person would do. <strong>Chain of custody</strong>: records everyone who touches a legal sample.",
  "Refusal: get <strong>written proof</strong>, inform the physician. Expressed consent is used for high-risk procedures, surgery and research.",
  "Chain-of-custody form: subject’s ID, collector, date/location/signature, and the signature of everyone who held it. Blood alcohol needs consent; clean with <strong>chlorhexidine</strong>."]},
 {h:"Organizations",items:[
  "<strong>CLIA</strong>: federal lab rules; certificate from <strong>CMS</strong> by complexity. <strong>JCAHO</strong> (Joint Commission): voluntary hospital accreditation. <strong>CLSI</strong>: lab standards (order of draw). <strong>NIOSH</strong>: part of CDC, work-injury research. <strong>CAP</strong>: pathologists who inspect labs. <strong>HIPAA</strong>: PHI privacy. <strong>OSHA</strong>: Bloodborne Pathogens Standard, revised 2001 for NSSPA."]},
 {h:"Non-blood specimens",items:[
  "Urine is the most-tested non-blood fluid. Random UA: midstream, sterile cup. <strong>Urine C&S</strong>: clean-catch midstream after antiseptic wipe. Drug screen: chain of custody. Pregnancy: first morning (most HCG).",
  "<strong>24-hour urine</strong>: flush the first morning void, collect everything for 24 h, keep cold, include the next morning’s first void.",
  "Handout: urine C&S → <strong>gray urine tube, stable 48 h</strong>. UA → <strong>yellow/tiger urine tube, stable 72 h</strong>. NP culture: Dacron/cotton swab.",
  "Semen: to lab within <strong>1 hour</strong>, room temp. Stool: <strong>urinate first</strong> (urine kills organisms). FOBT: 2–3 days. Sputum: first morning, deep cough, sterile cup. Infants: urine bag; plastic wrap in diaper for stool."]},
 {h:"Beyond the draw",items:[
  "Blood smear: within <strong>1 hour</strong>, drop ½ inch from frosted end, spreader <strong>30–35°</strong>. Bleeding time: Surgicutt incision <strong>5 cm below</strong> antecubital fossa, blot every <strong>30 s</strong>.",
  "Donation: age <strong>17–66</strong>, at least <strong>110 lb</strong>, <strong>16–18g</strong> needle, <strong>CPD</strong> anticoagulant, <strong>450 mL</strong>. Therapeutic phlebotomy: polycythemia, hemochromatosis. Autologous: own blood, surgery &gt;72 h later.",
  "Iatrogenic anemia: take no more than <strong>10%</strong> of blood volume. lb ÷ 2.2 = kg; kg × 100 = mL of blood.",
  "LIS handles requisitions, labels, results. Critical results: phone immediately, record the receiver’s full name, date and time."]}
]}
];
