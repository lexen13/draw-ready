let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){return Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(r))}}catch(e){}return JSON.parse(JSON.stringify(DEF))}
const SYNC={state:"checking",ref:null,busy:false,dirty:false,t:0};
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.updatedAt=Date.now();saveLocal();queuePush()}
const NEW_PER_DAY=15;

/* ---------- dates ---------- */
const DAY=864e5;
function ymd(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function parseYmd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function fmtDate(d,o){return d.toLocaleDateString("en-US",o||{weekday:"short",month:"short",day:"numeric"})}
function at(d,h){const x=new Date(d);x.setHours(h,0,0,0);return x}
function fridays(){ // every Friday from start until 8 classes are scheduled
  if(!S.start)return [];
  const out=[];let d=parseYmd(S.start),n=0,g=0;
  while(n<8&&g<30){const off=S.skip.includes(ymd(d));out.push({d,off,day:off?null:++n});d=addDays(d,7);g++}
  return out;
}
function classDates(){return fridays().filter(f=>!f.off).map(f=>f.d)}
function doneCount(now){const cd=classDates();return cd.filter(d=>at(d,16)<=now).length}
const isOpenDay=d=>d===0||(d>=1&&d<=8&&!DAYS[d-1].locked);
const qOk=i=>Q[i]&&isOpenDay(Q[i][0]);
const cOk=i=>CARDS[i]&&isOpenDay(CARDS[i][0]);
const openMisses=()=>Object.keys(S.misses).map(Number).filter(qOk);
function studyDay(){const n=doneCount(new Date());return Math.min(OPEN_THROUGH,Math.max(1,n))}
function nextClass(now){const cd=classDates();for(let i=0;i<cd.length;i++){if(at(cd[i],16)>now)return {d:cd[i],day:i+1}}return null}
function countdown(now,d){
  const s=at(d,10),e=at(d,16);
  if(now>=s&&now<e) return {big:"In class now",sub:"until 4:00 PM"};
  const ms=s-now,h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),dd=Math.floor(h/24);
  if(ymd(now)===ymd(d)) return {big:h+"h "+m+"m",sub:"Class today at 10:00 AM"};
  if(ymd(addDays(now,1))===ymd(d)) return {big:"Tomorrow",sub:"10:00 AM · in "+h+"h "+m+"m"};
  return {big:dd+" days "+(h%24)+" hr",sub:"until "+fmtDate(d,{weekday:"long",month:"short",day:"numeric"})+" · 10:00 AM"};
}
function markStudy(){
  const t=ymd(new Date()),y=ymd(addDays(new Date(),-1));
  if(S.streak.last===t) return;
  S.streak.count=S.streak.last===y?S.streak.count+1:1;S.streak.last=t;save();
}
function streakNow(){const t=ymd(new Date()),y=ymd(addDays(new Date(),-1));return (S.streak.last===t||S.streak.last===y)?S.streak.count:0}

/* ---------- spaced repetition (Leitner) ---------- */
const INTERVAL=[0,0,1,3,7,14];
const cardState=i=>S.cards[i]||null;
const isDue=i=>{const c=cardState(i);return c&&c.due<=Date.now()};
const dueCount=()=>CARDS.reduce((n,c,i)=>n+(isDue(i)&&cOk(i)?1:0),0);
const cardsOfDay=d=>CARDS.map((c,i)=>i).filter(i=>CARDS[i][0]===d);
const newCards=d=>cardsOfDay(d).filter(i=>!cardState(i));
function gradeCard(i,g){
  if(g===0){S.lapse=S.lapse||{};S.lapse[i]=(S.lapse[i]||0)+1}
  const c=cardState(i)||{b:1,due:0};
  const b=g===0?1:Math.min(5,c.b+(g===2?2:1));
  const d=new Date();d.setHours(4,0,0,0);
  S.cards[i]={b,due:g===0?Date.now():d.getTime()+INTERVAL[b]*DAY};save();
}
function mastered(d){const ids=cardsOfDay(d);return {n:ids.filter(i=>(S.cards[i]?.b||0)>=3).length,t:ids.length}}
function nextGap(i,g){const c=cardState(i)||{b:1};const b=Math.min(5,c.b+(g===2?2:1));const n=INTERVAL[b];return n===0?"today":n===1?"1 day":n+" days"}

function startDeck(kind,d){
  let ids;
  if(kind==="daily"){ids=shuffle(CARDS.map((c,i)=>i).filter(i=>isDue(i)&&cOk(i))).concat(newCards(d).slice(0,NEW_PER_DAY))}
  else {const all=cardsOfDay(d);const due=all.filter(i=>!cardState(i)||isDue(i));ids=shuffle(due.length?due:all)}
  if(!ids.length){toast("No cards due. Nice work.");return}
  deck={kind,d,queue:ids,i:0,flipped:false,again:{},done:0,from:V};
  V={tab:V.tab,sub:"deck"};render();
}
function renderDeck(){
  const k=deck,back=()=>{V=k.from;deck=null;render()};
  header(k.kind==="daily"?"Daily flashcards":dayName(k.d)+" cards",back);
  if(k.i>=k.queue.length){
    markStudy();
    $("#app").innerHTML=`<div class="card"><p class="eyebrow">Done</p><h2>${k.done} cards reviewed</h2><p class="muted" style="margin-top:6px">Missed cards come back tomorrow. Solid ones space out to 3, 7, then 14 days.</p></div><button class="btn primary block" id="dDone">Finish</button>`;
    $("#dDone").onclick=back;return;
  }
  const ci=k.queue[k.i],c=CARDS[ci],lab=c[3]==="proc"?"Venipuncture steps":c[3]==="ood"?"Order of draw":dayName(c[0]);
  $("#app").innerHTML=`
   <div class="spread"><span class="pill acc">${esc(lab)}</span><span class="muted small num">${k.i+1} / ${k.queue.length}</span></div>
   <div class="bar"><i style="width:${(k.i/k.queue.length*100).toFixed(1)}%"></i></div>
   <div class="fcard ${k.flipped?"is-back":""}" id="flash" role="button" tabindex="0" aria-label="${k.flipped?"Answer showing":"Show answer"}">
     <p class="eyebrow">${k.flipped?"Answer":"Prompt"}</p>
     <div class="big">${esc(k.flipped?c[2]:c[1])}</div>
     <p class="hint">${k.flipped?esc(c[1]):"Tap to see the answer"}</p>
   </div>
   ${k.flipped?`<div class="grade"><button class="btn" data-g="0">Again<small>soon</small></button><button class="btn" data-g="1">Got it<small>${nextGap(ci,1)}</small></button><button class="btn primary" data-g="2">Easy<small style="color:inherit;opacity:.8">${nextGap(ci,2)}</small></button></div>`
   :`<button class="btn primary block" id="flipBtn">Show answer</button>`}`;
  const flip=()=>{k.flipped=true;render()};
  $("#flash").onclick=()=>{if(!k.flipped)flip()};
  $("#flash").onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();if(!k.flipped)flip()}};
  $("#flipBtn")&&($("#flipBtn").onclick=flip);
  $$("[data-g]").forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g;gradeCard(ci,g);k.done++;
    if(g===0&&!k.again[ci]){k.again[ci]=1;k.queue.push(ci)}
    k.i++;k.flipped=false;render();
  });
}

/* =========================================================
   QUIZ ENGINE
   ========================================================= */
const QUIZ_N=50;
function startQuiz(kind,arg,size){
  let ids;
  const all=Q.map((q,i)=>i);
  if(kind==="day") ids=shuffle(all.filter(i=>Q[i][0]===arg)).slice(0,size||QUIZ_N);
  else if(kind==="misses") ids=shuffle(openMisses()).slice(0,25);
  else if(kind==="exam") ids=examPick(arg);
  else ids=arg; // generated items
  if(!ids||!ids.length){toast("No questions here yet");return}
  const items=ids.map(id=>{
    if(typeof id==="object")return id;
    const q=Q[id];const order=shuffle([0,1,2,3].filter(k=>q[3][k]!=null));
    return {id,w:q[0],d:q[1],text:q[2],choices:order.map(k=>q[3][k]),ans:order.indexOf(0),why:q[4]};
  });
  quiz={kind,arg,size,items,i:0,pick:Array(items.length).fill(null),locked:Array(items.length).fill(false),
    instant:kind!=="exam",from:V,started:Date.now(),limit:kind==="exam"?Math.round(items.length*72):0};
  V={tab:V.tab,sub:"quiz"};render();
}
function examPool(){return Q.map((q,i)=>i).filter(qOk)}
function examPick(n){return shuffle(examPool()).slice(0,n)}
function quizTitle(){const k=quiz.kind;return k==="day"?dayName(quiz.arg)+" quiz":k==="misses"?"Fix my misses":k==="exam"?"Mock exam":k==="qf"?"Tube quick-fire":k==="next"?"What comes next?":"Quiz"}
function renderQuiz(){
  const z=quiz,it=z.items[z.i],sel=z.pick[z.i],locked=z.locked[z.i];
  header(quizTitle(),()=>{clearInterval(examTimer);V=z.from;quiz=null;render()});
  const L="ABCD",answered=z.pick.filter(p=>p!==null).length;
  let fb="";
  if(z.instant&&locked){const ok=sel===it.ans;fb=`<div class="explain ${ok?"yes":"no"}"><b>${ok?"Correct":"Not quite · answer: "+esc(it.choices[it.ans])}</b>${esc(it.why||"")}</div>`}
  const tag=it.tag||((it.w!=null?dayName(it.w)+" · ":"")+(DOMAINS[it.d]||""));
  $("#app").innerHTML=`
   <div class="spread"><span class="pill acc">${esc(tag)}</span>
   <span class="muted small num">${z.kind==="exam"?`<span class="timer" id="clock"></span> · `:""}${z.i+1} / ${z.items.length}</span></div>
   <div class="bar"><i style="width:${((z.instant?z.i+(locked?1:0):answered)/z.items.length*100).toFixed(1)}%"></i></div>
   <p class="qtext">${esc(it.text)}</p>
   <div class="choices">${it.choices.map((c,k)=>{

   <div class="btns" style="grid-template-columns:1fr 2fr 1fr">
     <button class="btn" id="lPrev" aria-label="Previous card">Prev</button>
     <button class="btn primary" id="lPlay">${lis&&lis.playing?"Pause":"Play"}</button>
     <button class="btn" id="lNext" aria-label="Next card">Skip</button>
   </div>
   <p class="muted small">Keep this page open with the screen on. On iPhone, silent mode can mute speech.</p>`;
  $("#lDeck").onchange=e=>{stopListen();lis={key:e.target.value};render()};
  $("#lGap").onchange=e=>{S.gap=+e.target.value;save()};
  $("#lRate").onchange=e=>{S.rate=+e.target.value;save()};
  $("#lPlay").onclick=()=>{if(lis&&lis.playing)pauseListen();else startListen($("#lDeck").value)};
  const step=dir=>{if(!lis||!lis.list)return;synth.cancel();clearTimeout(lis.t);lis.i=(lis.i+dir+lis.list.length)%lis.list.length;if(lis.playing)speakCard();else{lis.showBack=false;render()}};
  $("#lNext").onclick=()=>step(1);$("#lPrev").onclick=()=>step(-1);
}
let wakeLock=null;
async function keepAwake(on){try{if(on&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request("screen")}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
function startListen(key){
  if(!lis||lis.key!==key||!lis.list)lis={key,list:listenDeck(key),i:0};
  lis.playing=true;markStudy();keepAwake(true);speakCard();
}
function pauseListen(){if(!lis)return;lis.playing=false;synth.cancel();clearTimeout(lis.t);keepAwake(false);render()}
function stopListen(){if(lis){lis.playing=false;clearTimeout(lis.t)}try{synth&&synth.cancel()}catch(e){}keepAwake(false)}
function say(text,cb){
  const u=new SpeechSynthesisUtterance(text.replace(/·/g,",").replace(/→/g,", then ").replace(/~/g,"about ").replace(/(\d)–(\d)/g,"$1 to $2").replace(/–/g,", ").replace(/″/g," inches").replace(/≥/g,"at least ").replace(/</g,"less than ").replace(/°/g," degrees").replace(/#(\d)/g,"number $1"));
  u.rate=S.rate||1;u.lang="en-US";
  u.onend=()=>{if(lis&&lis.playing)cb()};u.onerror=()=>{if(lis&&lis.playing)cb()};
  synth.speak(u);
}
function speakCard(){
  if(!lis||!lis.playing)return;
  const c=CARDS[lis.list[lis.i]];
  lis.phase="Prompt";lis.showBack=false;render();
  say(c[1],()=>{
    lis.phase=S.gap?"Your turn · answer out loud":"Answer";updListen();
    lis.t=setTimeout(()=>{
      if(!lis.playing)return;
      lis.phase="Answer";lis.showBack=true;render();
      say(c[2],()=>{lis.t=setTimeout(()=>{if(!lis.playing)return;lis.i=(lis.i+1)%lis.list.length;speakCard()},1200)});
    },(S.gap||0)*1000);
  });
}
function updListen(){const p=$("#lPhase");if(p)p.textContent=lis.phase}

/* ---------- progress view ---------- */
function overallPct(){const v=Object.values(S.dt||{});const c=v.reduce((a,x)=>a+x[0],0),n=v.reduce((a,x)=>a+x[1],0);return n?Math.round(c/n*100)+"%":"—"}
function barRow(label,c,n){const p=Math.round(c/n*100);return `<div class="dombar"><span>${esc(label)}</span><div class="bar ${p<75?"low":""}"><i style="width:${p}%"></i></div><span class="num small">${p}%</span></div>`}
function renderProgress(){
  header("Strengths & weak spots",()=>go("today"));
  const dt=S.dt||{},tt=S.tt||{},qs=S.qs||{},lp=S.lapse||{};
  const answered=Object.values(dt).reduce((a,x)=>a+x[1],0);
  if(!answered&&!Object.keys(lp).length){
    $("#app").innerHTML=`<div class="card"><h3>Nothing to show yet</h3><p class="muted" style="margin-top:6px">Take a quiz or a drill and this fills in: where you’re strong, where you’re weak, and the exact questions to review.</p></div><button class="btn primary block" id="pGo">Take the Day ${studyDay()} quiz</button>`;
    $("#pGo").onclick=()=>startQuiz("day",studyDay());return;
  }
  const byDom=Object.entries(dt).filter(([k,v])=>v[1]>=1).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
  const byTop=Object.entries(tt).filter(([k,v])=>v[1]>=1).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]);
  const missed=Object.entries(qs).map(([id,v])=>({id:+id,r:v[0],w:v[1]})).filter(x=>x.w>0&&qOk(x.id)).sort((a,b)=>(b.w-b.r)-(a.w-a.r)||b.w-a.w).slice(0,8);
  const forgot=Object.entries(lp).map(([i,n])=>({i:+i,n})).filter(x=>cOk(x.i)).sort((a,b)=>b.n-a.n).slice(0,8);
  const weakest=byDom.length&&byDom[0][1][0]/byDom[0][1][1]<0.75?DOMAINS[byDom[0][0]]:null;
  $("#app").innerHTML=`
   <div class="card"><p class="eyebrow">Overall</p><div class="stat num">${overallPct()}</div><p class="muted small" style="margin-top:4px">${answered} questions answered across quizzes, drills and mock exams.${weakest?` Weakest area: <b>${esc(weakest)}</b>.`:""}</p></div>
   <section class="card"><p class="eyebrow">By topic</p><div class="stack" style="gap:10px;padding-top:4px">${byTop.map(([k,v])=>barRow(k,v[0],v[1])).join("")}</div></section>
   <section class="card"><p class="eyebrow">By exam area (NHA)</p><div class="stack" style="gap:10px;padding-top:4px">${byDom.map(([k,v])=>barRow(DOMAINS[k]||k,v[0],v[1])).join("")}</div><p class="muted small" style="margin-top:8px">Red bars are under the 75% bar.</p></section>
   ${missed.length?`<section class="card"><p class="eyebrow">Most-missed questions</p><div class="stack" style="gap:12px;padding-top:4px">${missed.map(x=>{const q=Q[x.id];return `<div class="missitem"><b>${esc(q[2])}</b><span class="ans">✓ ${esc(q[3][0])}</span><span class="muted small num">Missed ${x.w}× · right ${x.r}×</span></div>`}).join("")}</div>
     <button class="btn primary block" id="pFix" style="margin-top:12px">Practice my misses</button></section>`:""}
   ${forgot.length?`<section class="card"><p class="eyebrow">Cards you keep forgetting</p><div class="stack" style="gap:10px;padding-top:4px">${forgot.map(x=>`<div class="missitem"><b>${esc(CARDS[x.i][1])}</b><span class="small">${esc(CARDS[x.i][2])}</span><span class="muted small num">“Again” ${x.n}×</span></div>`).join("")}</div></section>`:""}
   <section class="card"><p class="eyebrow">Drills</p>
     <p class="small" style="margin-top:4px">Order of draw: ${S.drillBest?`best ${(S.drillBest.ms/1000).toFixed(1)}s, ${S.drillBest.err} wrong`:"not tried"}</p>
     <p class="small">33 steps: ${PHASES.map((p,i)=>`${esc(p.name)} ${(S.procBest||{})[i]?(S.procBest[i].err===0?"✓":S.procBest[i].err+" wrong"):"—"}`).join(" · ")}</p></section>`;
  $("#pFix")&&($("#pFix").onclick=()=>startQuiz("misses"));
}

/* ---------- online saving (Claude account) ---------- */
function syncText(){
  const fb=SYNC.mode==="firebase";
  if(SYNC.state==="on")return fb?"✓ Saving online to "+(SYNC.email||"your account")+". Your progress follows you to any device.":"✓ Saving to your Claude account. Your progress follows you to any device.";
  if(SYNC.state==="checking")return "Checking online saving…";
  if(SYNC.state==="signin")return "Saved on this phone. Sign in below to also save online.";
  if(fb)return "Saved on this phone only. Online saving isn’t reachable right now.";
  if(typeof DR_HOST!=="undefined"&&DR_HOST==="github")return "Saved on this phone. Always open it from the home-screen icon.";
  return "Saved on this phone. Copy a backup code every few days so you never lose your progress.";
}
function updateSyncChip(){const el=$("#syncChip");if(el)el.textContent=syncText()}
function queuePush(){if(!SYNC.ref||SYNC.state==="readonly"||SYNC.state==="none"||SYNC.state==="signin")return;SYNC.dirty=true;clearTimeout(SYNC.t);SYNC.t=setTimeout(pushNow,1500)}
async function pushNow(retry){
  if(!SYNC.ref)return;
  if(SYNC.busy){SYNC.dirty=true;return}
  SYNC.busy=true;SYNC.dirty=false;
  try{await SYNC.ref.set(JSON.parse(JSON.stringify(S)));SYNC.state="on"}
  catch(e){const c=e&&e.code;
    if(c&&String(c).includes("unavailable")&&!retry){SYNC.busy=false;setTimeout(()=>pushNow(true),800+Math.random()*1200);return}
    if(c==="quota_exceeded"){S.history=S.history.slice(-30);SYNC.dirty=true}
    else SYNC.state="readonly"}
  SYNC.busy=false;updateSyncChip();
  if(SYNC.dirty&&SYNC.state==="on")queuePush();
}
async function pullAndMerge(){
  try{
    const snap=await SYNC.ref.get();
    const exists=typeof snap.exists==="function"?snap.exists():snap.exists;
    const remote=exists?snap.data():null;
    if(remote&&((remote.updatedAt||0)>(S.updatedAt||0)||!hasProgress())){
      S=Object.assign(JSON.parse(JSON.stringify(DEF)),JSON.parse(JSON.stringify(remote)));saveLocal();
      SYNC.state="on";if(!quiz&&!deck&&!drill&&!proc&&!(lis&&lis.playing))render();toast("Progress loaded");
    } else if(hasProgress()){SYNC.state="on";await pushNow()}
    else SYNC.state="on";
  }catch(e){SYNC.state="none"}
  updateSyncChip();refreshAuthBox();
}
/* GitHub version: Firebase account (same idea as LexenFitness) */
const AUTH_MSG={"auth/invalid-credential":"Email or password is wrong.","auth/wrong-password":"Email or password is wrong.","auth/user-not-found":"No account with that email. Tap Create account.","auth/email-already-in-use":"That email already has an account. Tap Sign in.","auth/weak-password":"Use at least 6 characters for the password.","auth/invalid-email":"Check the email address.","auth/too-many-requests":"Too many tries. Wait a minute and try again.","auth/network-request-failed":"No connection. Try again when online."};
let FB=null;
function initFirebase(){
  try{if(!firebase.apps.length)firebase.initializeApp(window.DR_FIREBASE);FB={auth:firebase.auth(),fs:firebase.firestore()}}
  catch(e){SYNC.state="none";updateSyncChip();return}
  SYNC.mode="firebase";SYNC.state="checking";
  FB.auth.onAuthStateChanged(async u=>{
    if(!u){SYNC.ref=null;SYNC.email="";SYNC.state="signin";updateSyncChip();refreshAuthBox();return}
    SYNC.email=u.email||"";SYNC.ref=FB.fs.doc("progress/"+u.uid);
    await pullAndMerge();
  });
}
function refreshAuthBox(){
  const box=$("#authBox");if(!box)return;
  if(SYNC.mode!=="firebase"||!FB){box.innerHTML="";return}
  const u=FB.auth.currentUser;
  if(u){box.innerHTML=`<div class="spread" style="margin-top:10px"><span class="small">Signed in as <b>${esc(u.email||"")}</b></span><button class="btn" id="auOut" style="min-height:40px;padding:8px 12px">Sign out</button></div>`;
    $("#auOut").onclick=async()=>{if(SYNC.dirty){clearTimeout(SYNC.t);await pushNow()}await FB.auth.signOut();toast("Signed out")};return}
  const inp='width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:10px;min-height:44px;font-size:16px';
  box.innerHTML=`<div class="stack" style="gap:8px;padding-top:10px">
    <label class="field" for="auEmail">Email<input id="auEmail" type="email" autocomplete="email" inputmode="email" style="${inp}"></label>
    <label class="field" for="auPass">Password<input id="auPass" type="password" autocomplete="current-password" style="${inp}"></label>
    <div class="btns"><button class="btn primary" id="auIn">Sign in</button><button class="btn" id="auNew">Create account</button></div>
    <button class="btn ghost" id="auForgot" style="min-height:36px">Forgot password</button>
    <p class="small" id="auMsg" style="color:var(--bad)"></p></div>`;
  const val=()=>[$("#auEmail").value.trim(),$("#auPass").value];
  const fail=e=>{$("#auMsg").textContent=AUTH_MSG[e&&e.code]||"Couldn’t sign in. Check the connection and try again."};
  $("#auIn").onclick=async()=>{const [e,p]=val();if(!e||!p){$("#auMsg").textContent="Enter email and password.";return}try{await FB.auth.signInWithEmailAndPassword(e,p)}catch(x){fail(x)}};
  $("#auNew").onclick=async()=>{const [e,p]=val();if(!e||!p){$("#auMsg").textContent="Enter an email and a password (6+ characters).";return}try{await FB.auth.createUserWithEmailAndPassword(e,p);toast("Account created")}catch(x){fail(x)}};
  $("#auForgot").onclick=async()=>{const [e]=val();if(!e){$("#auMsg").textContent="Type the email first.";return}try{await FB.auth.sendPasswordResetEmail(e);$("#auMsg").style.color="var(--ok)";$("#auMsg").textContent="Reset email sent."}catch(x){fail(x)}};
}
async function initSync(){
  if(window.DR_FIREBASE&&window.firebase){initFirebase();return}
  if(!window.claude||!window.claude.use){SYNC.state="none";updateSyncChip();return}
  try{
    const [user,db]=await Promise.all([window.claude.use("user"),window.claude.use("db")]);
    const id=user?await user.id():null;
    if(!db||!id){SYNC.state="none";updateSyncChip();return}
    SYNC.ref=db.doc("data/users/"+id+"/progress");
  }catch(e){SYNC.state="none";updateSyncChip();return}
  await pullAndMerge();
}
addEventListener("pagehide",()=>{if(SYNC.dirty){clearTimeout(SYNC.t);pushNow()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&SYNC.dirty){clearTimeout(SYNC.t);pushNow()}});

/* ---------- backup / restore ---------- */
function hasProgress(){return S.history.length>0||Object.keys(S.cards).length>0}
function backupNudge(){
  if(!hasProgress()||SYNC.state==="on")return "";
  const age=S.lastBackup?(Date.now()-S.lastBackup)/DAY:99;
  if(age<3)return "";
  return `<button class="action" id="bkNudge" style="border-color:var(--warn)"><div class="grow"><h3>Back up your progress</h3><p class="muted small">${S.lastBackup?"Last backup was "+Math.floor(age)+" days ago.":"No backup yet."} Takes 5 seconds.</p></div>${chev}</button>`;
}
function b64FromBytes(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function bytesFromB64(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function makeCode(){
  const data=Object.assign({},S,{history:S.history.slice(-30)});
  const bytes=new TextEncoder().encode(JSON.stringify(data));
  if(window.CompressionStream){try{const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw"));const out=new Uint8Array(await new Response(cs).arrayBuffer());return "DRZ."+b64FromBytes(out)}catch(e){}}
  return "DRJ."+b64FromBytes(bytes);
}
async function readCode(code){
  code=code.replace(/\s+/g,"");
  const [tag,body]=[code.slice(0,4),code.slice(4)];
  let bytes=bytesFromB64(body);
  if(tag==="DRZ."){const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));bytes=new Uint8Array(await new Response(ds).arrayBuffer())}
  else if(tag!=="DRJ.")throw new Error("tag");
  const obj=JSON.parse(new TextDecoder().decode(bytes));
  if(!obj||typeof obj!=="object"||!("cards" in obj))throw new Error("shape");
  return obj;
}
/* ---------- progress file (.json) ---------- */
const IS_GH=typeof DR_HOST!=="undefined"&&DR_HOST==="github";
function fileName(){return "draw-ready-progress-"+ymd(new Date())+".json"}
async function saveFile(){
  const text=JSON.stringify({app:"draw-ready",v:1,savedAt:new Date().toISOString(),progress:S});
  const file=new File([text],fileName(),{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Draw Ready progress"})}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
    S.lastBackup=Date.now();saveLocal();toast("Progress file saved");
  }catch(e){if(e&&e.name==="AbortError")return;toast("Couldn’t save the file. Try Copy backup code.")}
}
function applyProgress(obj){S=Object.assign(JSON.parse(JSON.stringify(DEF)),obj);save();toast("Progress loaded");render()}
async function loadFile(f){
  const box=$("#bkBox");
  try{
    const text=(await f.text()).trim();
    let obj;
    if(text.startsWith("DRZ.")||text.startsWith("DRJ."))obj=await readCode(text);
    else{const j=JSON.parse(text);obj=j&&j.progress?j.progress:j}
    if(!obj||typeof obj!=="object"||!("cards" in obj))throw new Error("shape");
    if(hasProgress()&&(obj.updatedAt||0)<(S.updatedAt||0)){
      box.innerHTML=`<div class="confirm" style="margin-top:10px"><p><b>This file is older than what’s on this phone.</b> Loading it replaces your newer progress.</p><div class="btns"><button class="btn" id="lfNo">Keep current</button><button class="btn primary" id="lfYes">Load file anyway</button></div></div>`;
      $("#lfNo").onclick=()=>box.innerHTML="";$("#lfYes").onclick=()=>applyProgress(obj);return;
    }
    applyProgress(obj);
  }catch(e){box.innerHTML=`<p class="small" style="margin-top:8px;color:var(--bad)">That file isn’t a Draw Ready progress file. Pick the file named draw-ready-progress-….json.</p>`}
}
function wireBackup(){
  $("#bkFile")&&($("#bkFile").onclick=saveFile);
  $("#bkPick").onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)loadFile(f);e.target.value=""};
  const box=$("#bkBox");
  $("#bkNudge")&&($("#bkNudge").onclick=()=>{$("#backupCard").scrollIntoView({behavior:"smooth",block:"center"});($("#bkFile")||$("#bkCopy")).focus()});
  $("#bkCopy").onclick=async()=>{
    const code=await makeCode();
    const done=()=>{S.lastBackup=Date.now();save();toast(copied?"Backup code copied":"Backup code ready")};
    let copied=false;
    try{await navigator.clipboard.writeText(code);copied=true}catch(e){}
    box.innerHTML=`<p class="small" style="margin-top:10px">${copied?"Copied. Paste it into a text to yourself.":"Select all and copy this code:"}</p><textarea id="bkOut" readonly rows="4" style="width:100%;margin-top:6px;font-family:var(--f-mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:8px">${esc(code)}</textarea>`;
    const ta=$("#bkOut");if(!copied){ta.focus();ta.select()}
    done();
    $("#bkCopy").textContent="Copy again";
  };
  $("#bkRestore").onclick=()=>{
    box.innerHTML=`<label class="field" for="bkIn" style="margin-top:10px">Paste the backup code<textarea id="bkIn" rows="4" style="width:100%;font-family:var(--f-mono);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:10px;padding:8px"></textarea></label>
      <p class="muted small" style="margin-top:6px">This replaces what’s on this phone now.</p>
      <button class="btn primary block" id="bkGo" style="margin-top:8px">Restore progress</button><p class="small" id="bkMsg" style="margin-top:6px;color:var(--bad)"></p>`;
    $("#bkGo").onclick=async()=>{
      const v=$("#bkIn").value.trim();
      if(!v){$("#bkMsg").textContent="Paste a code first.";return}
      try{const obj=await readCode(v);S=Object.assign(JSON.parse(JSON.stringify(DEF)),obj);save();toast("Progress restored");render()}
      catch(e){$("#bkMsg").textContent="That code didn’t work. Copy the whole code, starting with DRZ or DRJ, and try again."}
    };
  };
}

/* ---------- boot ---------- */
addEventListener("scroll",()=>{$("#top").classList.toggle("scrolled",scrollY>4)},{passive:true});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&V.tab==="today"&&!V.sub)render()});
setInterval(()=>{if(V.tab==="today"&&!V.sub&&!document.activeElement?.matches("input,select"))render()},60000);
render();
initSync();

if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
